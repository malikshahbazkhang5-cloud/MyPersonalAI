name: Build Android APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git libffi-dev libssl-dev python3-dev autoconf libtool zip unzip zlib1g-dev openjdk-17-jdk
        pip install --upgrade pip
        pip install buildozer cython
    - name: Build with Buildozer
      run: |
        buildozer -v android debug
    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: My-AI-APK
        path: bin/*.apk
